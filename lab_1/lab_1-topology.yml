# Containerlab topology file for Cisco Live EU 2025 Lab 1

name: clus25

mgmt:
  network: clab-management-network
  ipv4-subnet: 10.254.254.0/24
  
topology:
  nodes:
    xrd01:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:24.4.1
      startup-config: config/xrd01.cfg
      mgmt-ipv4: 10.254.254.101
      
    xrd02:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:24.4.1
      startup-config: config/xrd02.cfg
      mgmt-ipv4: 10.254.254.102

    xrd03:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:24.4.1
      startup-config: config/xrd03.cfg
      mgmt-ipv4: 10.254.254.103

    xrd04:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:24.4.1
      startup-config: config/xrd04.cfg
      mgmt-ipv4: 10.254.254.104

    xrd05:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:24.4.1
      startup-config: config/xrd05.cfg
      mgmt-ipv4: 10.254.254.105

    xrd06:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:24.4.1
      startup-config: config/xrd06.cfg
      mgmt-ipv4: 10.254.254.106

    xrd07:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:24.4.1
      startup-config: config/xrd07.cfg
      mgmt-ipv4: 10.254.254.107

    sonic08:
      kind: linux
      image: c8000-clab-sonic:43
      env:
          IMAGE: /opt/cisco/images/sonic-cisco-8000.bin
          PID: '8101-32H'
      mgmt-ipv4: 10.254.254.108

    berlin:
      kind: generic_vm
      image: vrnetlab/canonical_ubuntu:jammy
      mgmt-ipv4: 10.254.254.109

    rome:
      kind: linux
      image: ubuntu-22.04:clus2025
      mgmt-ipv4: 10.254.254.110

    amsterdam1:
      kind: bridge

    amsterdam2:
      kind: bridge

    berlin1:
      kind: bridge


  links:

    # Link between XR Routers
    - endpoints: ["xrd01:Gi0-0-0-1", "xrd02:Gi0-0-0-0"]      
    - endpoints: ["xrd01:Gi0-0-0-2", "xrd05:Gi0-0-0-0"]

    - endpoints: ["xrd02:Gi0-0-0-1", "xrd03:Gi0-0-0-0"]
    - endpoints: ["xrd02:Gi0-0-0-2", "xrd06:Gi0-0-0-1"]
    - endpoints: ["xrd02:Gi0-0-0-3", "berlin:eth1"]

    - endpoints: ["xrd05:Gi0-0-0-1", "sonic08:eth1"]
    - endpoints: ["xrd05:Gi0-0-0-2", "xrd06:Gi0-0-0-2"]

    - endpoints: ["xrd03:Gi0-0-0-1", "xrd04:Gi0-0-0-0"]

    - endpoints: ["xrd04:Gi0-0-0-1", "xrd07:Gi0-0-0-1"]
    - endpoints: ["xrd04:Gi0-0-0-2", "sonic08:eth2"]

    - endpoints: ["xrd06:Gi0-0-0-0", "xrd07:Gi0-0-0-2"]

    - endpoints: ["sonic08:eth3", "xrd07:Gi0-0-0-3"]

    # Link betwen xrd01 and the Amsterdam VM
    - endpoints: ["xrd01:Gi0-0-0-0", "amsterdam1:xrd01-Gi0-0-0-0"]
    - endpoints: ["xrd01:Gi0-0-0-3", "amsterdam2:xrd01-Gi0-0-0-3"]

    # Link betwen xrd07 and the Rome VM
    - endpoints: ["xrd07:Gi0-0-0-0", "rome:eth1"]
    - endpoints: ["xrd07:Gi0-0-0-4", "rome:eth2"]
    
    # Link betwen xrd02 and the Berlin VM
    - endpoints: ["xrd02:Gi0-0-0-4", "berlin1:xrd02-Gi0-0-0-4"]



